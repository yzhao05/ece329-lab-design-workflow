<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https: http://127.0.0.1:8080 http://localhost:8080; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>反馈经验审阅 · ECE329</title>
  <link rel="stylesheet" href="assets/styles.css?v=20260920-pdf-languages">
  <link rel="stylesheet" href="assets/feedback.css?v=20260921-diagnostics">
</head>
<body>
  <main class="feedback-review">
    <a href="./">返回设计工作台</a>
    <button id="languageToggle" class="ghost-button" type="button" data-i18n-ignore>English</button>
    <button id="translationRetry" class="ghost-button" type="button" hidden>Retry translation</button>
    <h1>反馈经验审阅</h1>
    <p>核对反馈证据、适用范围和处理建议。确认经验不含个人信息、实验专属参数或越权指令，并记录验证依据后再启用。启用结果从下一轮检索生效；候选经验不会自动指导设计。</p>
    <form id="reviewLogin" class="feedback-form">
      <label for="reviewToken">维护者令牌（ECE329_FEEDBACK_ADMIN_TOKEN）</label>
      <input id="reviewToken" type="password" autocomplete="off" required>
      <label for="reviewFilter">查看状态</label>
      <select id="reviewFilter"><optgroup label="反馈处理状态"><option value="feedback:all">全部反馈（含未生成经验）</option><option value="feedback:queued">等待分析的反馈</option><option value="feedback:running">分析中的反馈</option><option value="feedback:failed">分析失败的反馈</option><option value="feedback:no_learning">未提炼经验的反馈</option><option value="feedback:duplicate">重复经验的反馈</option><option value="feedback:candidate">已生成经验的反馈</option></optgroup><optgroup label="经验状态"><option value="candidate">待审阅</option><option value="active">已启用</option><option value="stopped">已停止</option></optgroup></select>
      <div class="experience-actions"><button type="submit" class="send-button">加载记录</button><button id="reviewUsage" type="button" class="ghost-button">设计用量记录</button><button id="reviewLogout" type="button" class="ghost-button">清除令牌</button></div>
    </form>
    <p>令牌只用于当前页面，不保存在浏览器存储中。全部反馈包含排队、失败、未提炼和重复记录；分析失败时可在这里重试，仍受十次尝试上限限制。点击加载记录刷新状态。</p>
    <p id="reviewStatus" role="status" aria-live="polite"></p>
    <section id="reviewCards" aria-label="经验及证据"></section>
    <div class="experience-actions"><button id="reviewPrevious" type="button" class="ghost-button" disabled>上一页</button><button id="reviewNext" type="button" class="ghost-button" disabled>下一页</button></div>
  </main>
  <script src="assets/config.js?v=20260824-unified-semantics"></script>
  <script src="assets/i18n-catalog.js?v=20260920-evidence-reader"></script>
  <script src="assets/i18n.js?v=20260921-translation-review"></script>
  <script src="assets/usage-ui.js?v=20260919-usage-detail"></script>
  <script src="assets/feedback-diagnostics.js?v=20260921-diagnostics-review"></script>
  <script src="assets/review-evidence.js?v=20260921-analysis-translation"></script>
  <script src="assets/feedback-review.js?v=20260921-translation-review"></script>
</body>
</html>
