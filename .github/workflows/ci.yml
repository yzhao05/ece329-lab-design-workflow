name: Test backend and container

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Run tests and static checks
        env:
          ECE329_GENERATOR: rule
        run: |
          python -m pytest -q
          python -m compileall -q src tests tools
          node --check docs/assets/i18n-catalog.js
          node --check docs/assets/i18n.js
          node --check docs/assets/model-popover.js
          node --check docs/assets/app.js
          node --check docs/assets/model-strategy.js
          node --check docs/assets/feedback-diagnostics.js
          node --check docs/assets/feedback-client.js
          node --check docs/assets/feedback-images.js
          node --check docs/assets/feedback-ui.js
          node --check docs/assets/review-evidence.js
          node --check docs/assets/feedback-review.js
          node --check docs/assets/usage-ui.js
          node --check docs/assets/insight-folds.js
          node --test tests/frontend/feedback.test.cjs
          node --test tests/frontend/feedback-diagnostics.test.cjs
          node --test tests/frontend/feedback-review.test.cjs tests/frontend/unity-layout.test.cjs
          node --test tests/frontend/usage.test.cjs
          node --test tests/frontend/insight-folds.test.cjs
          node --test tests/frontend/model-selection.test.cjs

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag ece329-workflow-api:ci .

  deploy-backend:
    needs: [test, container]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: render-backend-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check this is still the latest main commit
        id: current
        shell: bash
        run: |
          remote_ref="$(git ls-remote --exit-code origin refs/heads/main)"
          latest_sha="${remote_ref%%$'\t'*}"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping deployment of a superseded commit."
          fi
      - name: Trigger backend deployment after checks pass
        if: steps.current.outputs.deploy == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: python tools/trigger_render_deploy.py
