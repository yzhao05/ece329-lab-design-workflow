name: Test backend and container

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[test]"

      - name: Run tests and static checks
        env:
          ECE329_GENERATOR: rule
        run: |
          python -m pytest -q
          python -m compileall -q src tests tools
          node --check docs/assets/app.js
          node --check docs/assets/model-strategy.js
          node --check docs/assets/feedback-client.js
          node --check docs/assets/feedback-ui.js
          node --check docs/assets/feedback-review.js
          node --test tests/frontend/feedback.test.cjs
          node --test tests/frontend/model-selection.test.cjs

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag ece329-workflow-api:ci .
